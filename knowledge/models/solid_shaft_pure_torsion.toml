model_id = "solid_shaft_pure_torsion_v1"
title = "Theoretical minimum diameter of a solid shaft in pure torsion"
status = "validated calculator model"
calculator_module = "mechanical_agent.calculators.shaft_torsion"
calculator_function = "calculate_solid_shaft_min_diameter"
dsh_skill = "solid-shaft-torsion"
purpose = "Size a solid circular shaft by an allowable torsional shear stress under steady pure torque."
equation = "tau_max = 16*T_Nmm/(pi*d_mm^3); d_min_mm = (16*T_Nmm/(pi*tau_allow_MPa))^(1/3)"
derivation = "Section 10.3 gives tau = T*r/J. For a solid circle, r = d/2 and J = pi*d^4/32; solve tau_max <= tau_allow for d."
inputs = ["torque_nm", "allowable_shear_mpa"]
output = "min_diameter_mm"
units = ["T input: N*m", "T internal: N*mm (input multiplied by 1000)", "tau and tau_allow: MPa = N/mm^2", "d: mm"]
assumptions = ["solid circular shaft", "pure torsion only", "steady torque", "no bending", "no fatigue", "no keyway", "no stress concentration", "no shock factor", "no stiffness criterion"]
limitations = ["Theoretical minimum strength diameter only; not a final production diameter.", "Does not check bending, fatigue, keyways, stress concentrations, shock loading, or torsional stiffness."]
source_ids = ["air_force_stress_manual_shafting"]
